name: Publicar álbum no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Executor para a publicação manual
        required: false
        default: ubuntu-latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        shell: bash
        run: |
          mkdir site
          cp index.html site/
          cp -r data photos site/
      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
